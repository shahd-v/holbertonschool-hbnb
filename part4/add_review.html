<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add a Review · HBNB</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="split-screen">
        <div class="split-photo" id="review-photo" style="background-image: url('Images/listing-najdi-suite.jpg');">
            <div class="split-photo-caption">
                <span class="hero-label" id="stay-dates">Your Stay · 24–28 August</span>
                <p class="split-caption-title" id="stay-place-name">Loading place…</p>
            </div>
        </div>

        <div class="split-panel">
            <div class="split-panel-inner">
                <h1>How was your stay?</h1>
                <p class="subtitle">Your review helps other guests find residences worth the journey.</p>

                <form id="review-form" class="form">
                    <div class="form-group">
                        <label>Rating</label>
                        <div class="star-rating" id="star-rating">
                            <button type="button" class="star" data-value="1">★</button>
                            <button type="button" class="star" data-value="2">★</button>
                            <button type="button" class="star" data-value="3">★</button>
                            <button type="button" class="star" data-value="4">★</button>
                            <button type="button" class="star" data-value="5">★</button>
                        </div>
                        <input type="hidden" id="rating" name="rating" value="5">
                    </div>

                    <div class="form-group">
                        <label for="review-text">Your Review</label>
                        <textarea id="review-text" name="review" placeholder="Tell us about the space, the view, the service…" required></textarea>
                    </div>

                    <p id="review-error" class="error-msg" style="display: none;"></p>

                    <button type="submit" class="btn btn-accent btn-block">Submit Review</button>
                </form>

                <p class="form-hint">Reviews are published after your checkout date.</p>
            </div>
        </div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
