<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Details · HBNB</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">HBNB</a>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Stays</a></li>
                <li><a href="reviews.html">Experiences</a></li>
                <li><a href="https://www.visitsaudi.com/en" target="_blank" rel="noopener">Riyadh Guide</a></li>
                <li><a href="login.html">Host With Us</a></li>
            </ul>
        </nav>
        <a href="login.html" id="login-link" class="btn btn-ghost">Login</a>
    </header>

    <main class="place-page">
        <!-- Gallery: populated dynamically -->
        <div class="place-gallery" id="place-gallery">
            <!-- Main image + side images injected by scripts.js -->
        </div>

        <div class="place-layout">
            <!-- Left: details -->
            <section id="place-details" class="place-details">
                <p>Loading place details…</p>
            </section>

            <!-- Right: booking panel -->
            <aside class="booking-panel" id="booking-panel">
                <!-- Price + dates + guests injected by scripts.js -->
            </aside>
        </div>

        <div class="reviews-header">
            <h2>Guest Reviews</h2>
        </div>

        <section id="reviews" class="reviews-grid">
            <!-- Reviews injected by scripts.js -->
        </section>

        <section class="write-review" id="add-review">
            <div class="write-review-inner">
                <h2>Share your experience</h2>
                <p class="subtitle">Tell fellow guests about your stay here.</p>

                <p id="write-review-signed-out" class="form-footnote" style="display: none;">
                    <a href="login.html">Sign in</a> to leave a review.
                </p>

                <form id="review-form" class="form">
                    <div class="form-group">
                        <label>Rating</label>
                        <div class="star-rating" id="star-rating">
                            <button type="button" class="star" data-value="1">★</button>
                            <button type="button" class="star" data-value="2">★</button>
                            <button type="button" class="star" data-value="3">★</button>
                            <button type="button" class="star" data-value="4">★</button>
                            <button type="button" class="star" data-value="5">★</button>
                        </div>
                        <input type="hidden" id="rating" name="rating" value="5">
                    </div>

                    <div class="form-group">
                        <label for="review-text">Your Review</label>
                        <textarea id="review-text" name="review" placeholder="Tell us about the space, the view, the service…" required></textarea>
                    </div>

                    <p id="review-error" class="error-msg" style="display: none;"></p>
                    <p id="review-success" class="success-msg" style="display: none;"></p>

                    <button type="submit" class="btn btn-accent btn-block">Submit Review</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 HBNB. All rights reserved.</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
